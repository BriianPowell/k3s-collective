# Renders the whole Flux tree on every pull request (including Renovate's chart bumps): builds each
# Kustomization and renders each HelmRelease with its values (including chart values.schema.json
# validation), so template and schema errors show up on the PR instead of as a failed HelmRelease
# upgrade on the cluster. It cannot catch runtime behaviour or network policies; test those after
# rollout.
# https://github.com/home-operations/flate (successor to the sunset allenporter/flux-local)
name: ci

on:
  pull_request:
    branches: [main]

# Read-only and no secrets: this runs untrusted PR content (never use pull_request_target here).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flate-test:
    name: flate test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Static binary, no flux CLI needed. Pinned by SHA, so set the version explicitly: the action
      # only follows its own ref for tags and falls back to "latest" for SHAs.
      # The action exports FLATE_BASE (default: the default branch), which switches `flate test` to
      # changed-only mode and needs that branch in the checkout. This job uses a shallow checkout and
      # validates the whole tree, so clear the base.
      - name: Install flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: 0.6.5
          base: ''

      - name: Render and validate
        run: flate test all --path clusters/k3s

  # Posts what the PR changes in the *rendered* manifests (a chart bump shows the resources it
  # touches, not just the version line). Separate job so only it gets `pull-requests: write`, and it
  # skips fork PRs, which would not get a write token anyway.
  flate-diff:
    name: flate diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history so flate can find the merge base with main.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: 0.6.5

      - name: Render diff
        run: |
          set -o pipefail
          flate diff all --path clusters/k3s --base "origin/${BASE_REF}" --output github > diff.md
          # A PR comment holds at most 65536 characters; leave room for the header and footer.
          if [ "$(wc -c < diff.md)" -gt 60000 ]; then
            head -c 60000 diff.md > diff.trunc && printf '\n\n_Diff truncated; run flate diff locally for the rest._\n' >> diff.trunc
            mv diff.trunc diff.md
          fi
        env:
          BASE_REF: ${{ github.base_ref }}

      # One comment per PR, updated in place. The marker finds it again on later pushes.
      - name: Comment on the pull request
        run: |
          marker='<!-- flate-diff -->'
          { echo "$marker"; echo '### flate diff (rendered changes)'; echo; if [ -s diff.md ]; then cat diff.md; else echo 'No rendered changes.'; fi; } > comment.md
          id=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq "map(select(.user.type == \"Bot\" and (.body | startswith(\"${marker}\")))) | first | .id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F body=@comment.md > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
