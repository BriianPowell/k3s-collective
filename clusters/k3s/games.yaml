apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: games
  namespace: flux-system
spec:
  # Kustomization is active, but every game HelmRelease is `suspend: true` with no workloads
  # running. To start a game, un-suspend its HelmRelease and set its replicas.
  suspend: false
  interval: 10m0s
  # No health wait: suspended HelmReleases keep their last Ready condition (False for V Rising
  # until it is resumed), so waiting would fail every run.
  wait: false
  timeout: 5m0s
  retryInterval: 2m0s
  prune: true
  dependsOn:
    - name: infra-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/games
