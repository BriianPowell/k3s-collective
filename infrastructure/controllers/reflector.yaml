apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: reflector
  namespace: reflector
  labels:
    app.kubernetes.io/component: helm-repository
    app.kubernetes.io/name: reflector
spec:
  interval: 24h
  url: https://emberstack.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector
  labels:
    app.kubernetes.io/component: helm-release
    app.kubernetes.io/name: reflector
spec:
  interval: 1h0m0s
  maxHistory: 3
  chart:
    spec:
      chart: reflector
      sourceRef:
        kind: HelmRepository
        name: reflector
        namespace: reflector
      version: '>=7.0.0 <8.0.0'
  values:
    # Utilities id 1511 instead of the chart's 1000 (the nodes' admin login); see docs/uids.md.
    # It needs the Kubernetes API (it copies secrets), so the service account token stays mounted.
    podSecurityContext:
      fsGroup: 1511
    securityContext:
      runAsNonRoot: true
      runAsUser: 1511
      runAsGroup: 1511
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 200Mi
