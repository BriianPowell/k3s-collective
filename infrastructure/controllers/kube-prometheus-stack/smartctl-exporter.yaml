#
# Reference:
# https://github.com/prometheus-community/smartctl_exporter
# https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-smartctl-exporter/values.yaml
#

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/component: helm-release
    app.kubernetes.io/name: smartctl-exporter
spec:
  interval: 1h0m0s
  maxHistory: 3
  chart:
    spec:
      chart: prometheus-smartctl-exporter
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      version: '>=0.10.0 <1.0.0'
  # The chart has no switch for this, and the exporter only reads disk SMART data.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
            patch: |
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
  values:
    image:
      repository: quay.io/prometheuscommunity/smartctl-exporter
      # Overrides the image tag whose default is the chart appVersion. Kept current by Flux image
      # automation (smartctl-exporter-image-automation.yaml). Started at what was running (v0.14.0);
      # v0.15.0 exists and is untried, and automation will adopt it within ~24h of the push.
      tag: v0.15.0 # {"$imagepolicy": "monitoring:smartctl-exporter:tag"}
      pullPolicy: IfNotPresent
      pullSecrets: []
    serviceMonitor:
      enabled: true
    prometheusRules:
      enabled: true
    config:
      devices:
        - /dev/sda
        - /dev/sdb
        - /dev/sdc
        - /dev/sdd
        - /dev/sde
    common:
      config:
        bind_to: '0.0.0.0:9633'
        url_path: /metrics
        smartctl_location: smartctl
        collect_not_more_than_period: 120s
