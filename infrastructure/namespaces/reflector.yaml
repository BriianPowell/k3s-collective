apiVersion: v1
kind: Namespace
metadata:
  name: reflector
  labels:
    # Every pod here passes `restricted`; keep it that way.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    app.kubernetes.io/component: reflector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: reflector
automountServiceAccountToken: false
