apiVersion: v1
kind: Namespace
metadata:
  name: reloader
  labels:
    # Every pod here passes `restricted`; keep it that way.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    app.kubernetes.io/component: reloader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: reloader
automountServiceAccountToken: false
