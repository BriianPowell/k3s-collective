apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
  labels:
    # privileged: the agent mounts the node's container logs (hostPath), which baseline forbids.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/enforce-version: latest
    app.kubernetes.io/component: security
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: crowdsec
automountServiceAccountToken: false
