# Game workloads only. Their ingress is restricted to Traefik (games-ingress.yaml); AdGuard has
# its own egress and ingress policies (adguard-egress.yaml, adguard-ingress.yaml).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: valheim
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: minecraft
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: v-rising
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}
