  labels:
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/name: prowlarr
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - prowlarr
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - radarr
                  - sonarr-tv
                  - sonarr-anime
      ports:
        - port: 7878
          protocol: TCP
        - port: 8989
          protocol: TCP
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - lidarr
      ports:
        - port: 8686
          protocol: TCP
    - to:
        - podSelector:
