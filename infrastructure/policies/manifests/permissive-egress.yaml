# Allow-all egress: workloads need arbitrary ports (torrent/VPN, game UDP, Prometheus scrapes, CrowdSec hub, etc.).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: media
spec:
  # Plex, FlareSolverr, Bazarr and Kapowarr are excluded and limited by plex-egress,
  # flaresolverr-egress and media-egress (in this directory). NetworkPolicies are additive, so
  # they must not match here or their restrictions are a no-op.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - plex-media-server
          - flaresolverr
          - bazarr
          - bazarr-anime
          - kapowarr
  policyTypes:
    - Egress
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: crowdsec
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}
