apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: standard-ingress
  namespace: media
spec:
  # Pods with their own ingress policy (manifests/media-ingress.yaml) are excluded; policies
  # are additive, so leaving them in would let all of kube-system and the namespace through.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - radarr
          - sonarr-tv
          - sonarr-anime
          - prowlarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - from:
        - podSelector: {}
---
