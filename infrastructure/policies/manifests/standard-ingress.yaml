# Baseline ingress: Traefik pods (kube-system) for routed apps, Prometheus for scrapes, and the
# namespace's own pods. Not the whole of kube-system or monitoring (oauth2-proxy, ntfy, svclb,
# Grafana, Alloy, ... have no business calling into these pods). cert-manager, reflector and
# reloader have no route, so they allow Prometheus and same-namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: standard-ingress
  namespace: media
spec:
  # Pods with their own ingress policy (manifests/media-ingress.yaml) are excluded; policies
  # are additive, so leaving them in would let the namespace's pods reach them freely.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - radarr
          - sonarr-tv
          - sonarr-anime
          - prowlarr
          - flaresolverr
          - bazarr
          - bazarr-anime
          - kapowarr
          - deluge
  policyTypes:
    - Ingress
  ingress:
    # Traefik only (not all of kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
    # Prometheus scrapes (not every pod in monitoring)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: standard-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
