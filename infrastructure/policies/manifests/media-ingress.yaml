              app.kubernetes.io/name: traefik
      ports:
        - port: 8989
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8989
          protocol: TCP
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - prowlarr
                  - seerr
                  - bazarr
                  - recyclarr
                  - sonarr-tv-exportarr
      ports:
        - port: 8989
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sonarr-anime-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
