---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowlarr-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 9696
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9696
          protocol: TCP
    # Sonarr/Radarr call Prowlarr for indexer searches.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - radarr
                  - sonarr-tv
                  - sonarr-anime
                  - prowlarr-exportarr
      ports:
        - port: 9696
          protocol: TCP
---
# FlareSolverr is a headless browser that fetches arbitrary URLs for Prowlarr, so it must only be
# reachable by Prowlarr. There is deliberately no IngressRoute, so no Traefik rule here. The
# monitoring namespace may scrape :8192 (PROMETHEUS_ENABLED; the ServiceMonitor is currently
# commented out in apps/monitoring/prometheus/kustomization.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flaresolverr-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prowlarr
      ports:
        - port: 8191
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8192
          protocol: TCP
---
# Bazarr (both instances). With its own login turned off (SSO only at Traefik), reaching the UI
# means reaching Bazarr's post-processing command setting, which runs arbitrary commands. So only
# Traefik may connect, plus each instance's exportarr sidecar-style exporter. Bazarr itself calls
# Sonarr/Radarr (outbound, see media-egress.yaml); nothing else in the cluster calls it.
# Prometheus scrapes the exporters, not Bazarr, so there is no monitoring rule here.
# The exporters are listed together for both instances; each only targets its own Bazarr.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bazarr-ingress
  namespace: media
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - bazarr
          - bazarr-anime
  policyTypes:
    - Ingress
  ingress:
    # Traefik (public hostname, behind SSO)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 6767
          protocol: TCP
    # exportarr metrics exporters
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - bazarr-exportarr
                  - bazarr-anime-exportarr
      ports:
        - port: 6767
          protocol: TCP
---
# Kapowarr: only Traefik. It has no exporter and nothing in the cluster calls it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kapowarr-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kapowarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 5656
          protocol: TCP
---
# Deluge: web UI :8112 for Traefik (behind SSO), the arr download clients and the exporter, and
# the daemon :58846 for the tqm CronJob only. Peer traffic arrives over the WireGuard tunnel inside
# the pod (wg0), not on the pod network, so it is not affected by this policy. Prometheus scrapes
# the exporter, not Deluge. Callers read from tqm/config.yaml and each app's download client
# (Prowlarr's read from its DB: Deluge at deluge.media.svc:8112).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deluge-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: deluge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8112
          protocol: TCP
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - radarr
                  - sonarr-tv
                  - sonarr-anime
                  # Prowlarr has its own Deluge download client (manual grabs).
                  - prowlarr
                  # Scaled to 0 today; listed so they work when brought back.
                  - lidarr
                  - readarr
                  - deluge-exporter
      ports:
        - port: 8112
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tqm
      ports:
        - port: 58846
          protocol: TCP
