apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: standard-ingress
  namespace: homeassistant
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Traefik only (not all of kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
    # Prometheus scrapes (not every pod in monitoring)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
    # CloudNativePG operator only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
    - from:
        - podSelector: {}
---
