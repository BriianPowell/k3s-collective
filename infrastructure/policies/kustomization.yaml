apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Unrestricted: flux-system (gotk policies), cnpg-system, onepassword (cross-ns API clients).
# kube-system: CIS ingress policies in manifests/kube-system.yaml.

resources:
  - manifests/adguard-egress.yaml
  - manifests/adguard-ingress.yaml
  - manifests/atuin-egress.yaml
  - manifests/cnpg-egress.yaml
  - manifests/cnpg-ingress.yaml
  - manifests/crowdsec-egress.yaml
  - manifests/flaresolverr-egress.yaml
  - manifests/games-ingress.yaml
  - manifests/kube-system.yaml
  - manifests/media-egress.yaml
  - manifests/media-ingress.yaml
  - manifests/media-limitrange.yaml
  - manifests/monitoring-egress.yaml
  - manifests/open-egress.yaml
  - manifests/permissive-egress.yaml
  - manifests/plex-egress.yaml
  - manifests/renovate-network.yaml
  - manifests/standard-egress.yaml
  - manifests/standard-ingress.yaml
