#
# Reference:
# https://github.com/FlareSolverr/FlareSolverr
#

apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: media
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/name: flaresolverr
spec:
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: flaresolverr
  type: ClusterIP
  ports:
    - name: http
      port: 8191
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 8192
      protocol: TCP
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: flaresolverr
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: flaresolverr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/name: flaresolverr
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: abaddon
      # FlareSolverr never talks to the Kubernetes API, so do not hand a token to a headless
      # browser that renders untrusted pages.
      automountServiceAccountToken: false
      # The image already runs as uid 1000 (flaresolverr); this makes it enforced.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2 # {"$imagepolicy": "media:flaresolverr"}
          imagePullPolicy: Always
          # Not read-only: Chrome writes its profile and temp files. Not digest-pinned: the
          # image line above is rewritten by Flux image automation, which would drop a digest.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: America/Los_Angeles
            - name: PROMETHEUS_ENABLED
              value: 'true'
            - name: PROMETHEUS_PORT
              value: '8192'
          ports:
            - name: http
              containerPort: 8191
              protocol: TCP
            - name: metrics
              containerPort: 8192
              protocol: TCP
