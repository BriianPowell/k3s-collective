apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: media
  labels:
    app.kubernetes.io/component: config
    app.kubernetes.io/name: recyclarr
data:
  recyclarr.yml: |
    # yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json

    # An empty starter config to use with Recyclarr. Update the values below as needed for your
    # instance. You will be required to update the `api_key` and `base_url` for each instance you want
    # to use.
    #
    # If you'd rather use pre-built configuration instead of building your own from scratch, see these
    # pages:
    # - Config Templates: https://recyclarr.dev/wiki/guide-configs/
    # - CLI Command: https://recyclarr.dev/wiki/cli/config/list/templates/
    #
    # This file WILL NOT WORK as it currently is. You need to read the documentation and build this
    # configuration from scratch. Note that there's no "one size fits all" configuration. Please refer
    # to the TRaSH Guides to understand how to build the appropriate configuration based on your
    # hardware setup and capabilities.
    #
    # For more details on the configuration, see the Configuration Reference on the wiki here:
    # https://recyclarr.dev/wiki/yaml/config-reference/
    #
    # Want a more flexible file layout?
    # See: https://recyclarr.dev/wiki/file-structure/

    # Configuration specific to Sonarr. For Radarr, the layout is the same.
    # See: https://recyclarr.dev/wiki/yaml/config-reference/basic/
    # Instance Definition: https://recyclarr.dev/wiki/yaml/config-reference/basic/
    radarr:
      movies:
        base_url: !secret radarr_url
        api_key: !secret radarr_api_key

        quality_definition:
          type: movie

        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
          # The same trash_id is used twice (a guide profile plus a variant), so each entry needs an
          # explicit name. Keep this one equal to the guide's name so the existing profile is matched.
          - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
            name: UHD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
          # Variant of the UHD profile that also accepts 1080p, so a movie with no 2160p release is
          # still grabbed without switching profiles. Radarr ranks by quality order first, so any
          # 2160p release beats every 1080p one; 1080p is only used when no 2160p exists. Custom
          # format scores for the UHD side come from the guide (same trash_id); the HD Bluray tier
          # formats are added under `custom_formats` below so 1080p releases are still ranked.
          # https://recyclarr.dev/reference/configuration/quality-profiles/
          - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB, variant
            name: UHD/HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
            upgrade:
              allowed: true
              until_quality: Bluray-2160p
              until_score: 10000
            min_format_score: 0
            min_upgrade_format_score: 1
            qualities:
              - name: Bluray-2160p
              - name: WEB 2160p
                qualities:
                  - WEBRip-2160p
                  - WEBDL-2160p
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBRip-1080p
                  - WEBDL-1080p
              - name: Bluray-720p
          - trash_id: 9ca12ea80aa55ef916e3751f4b874151 # Remux + WEB 1080p
            reset_unmatched_scores:
              enabled: true
          - trash_id: fd161a61e3ab826d3a22d53f935696dd # Remux + WEB 2160p
            reset_unmatched_scores:
              enabled: true
          - trash_id: 722b624f9af1e492284c4bc842153a38  # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true

        # HD Bluray tier formats (from the HD Bluray + WEB guide profile), scored on the combined
        # profile only so 1080p Bluray releases are ranked by release group like in the HD profile.
        custom_formats:
          - trash_ids:
              - ed27ebfef2f323e964fb1f61391bcb35 # HD Bluray Tier 01
              - c20c8647f2746a1f4c4262b0fbbeeeae # HD Bluray Tier 02
              - 5608c71bcebba0a5e666223bae8c9227 # HD Bluray Tier 03
            assign_scores_to:
              - name: UHD/HD Bluray + WEB

    sonarr:
      tv:
        base_url: !secret sonarr_tv_url
        api_key: !secret sonarr_tv_api_key

        quality_definition:
          type: series

        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
            reset_unmatched_scores:
              enabled: true
          - trash_id: 9d142234e45d6143785ac55f5a9e8dc9 # WEB-1080p (Alternative)
            reset_unmatched_scores:
              enabled: true
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
            reset_unmatched_scores:
              enabled: true
          - trash_id: dfa5eaae7894077ad6449169b6eb03e0 # WEB-2160p (Alternative)
            reset_unmatched_scores:
              enabled: true

      anime:
        base_url: !secret sonarr_anime_url
        api_key: !secret sonarr_anime_api_key

        quality_definition:
          type: anime

        quality_profiles:
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true
