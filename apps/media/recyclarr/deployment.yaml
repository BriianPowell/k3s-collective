apiVersion: apps/v1
kind: Deployment
metadata:
  name: recyclarr
  namespace: media
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: recyclarr
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: recyclarr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/name: recyclarr
      annotations:
        configmap.reloader.stakater.com/reload: recyclarr-config
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        # Makes the existing root-owned /config volume writable by gid 1501 (Seerr does the same).
        fsGroup: 1501
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: abaddon
      containers:
        - name: recyclarr
          image: ghcr.io/recyclarr/recyclarr:9.0.0 # {"$imagepolicy": "media:recyclarr"}
          imagePullPolicy: Always
          env:
            - name: TZ
              value: America/Los_Angeles
            # v9 runs a persistent server that refuses to start without a key of 32+ characters
            # (generate with `openssl rand -hex 32`; field `recyclarr_api_key` on the Arr Stack item).
            # https://recyclarr.dev/guide/upgrade-guide/v9.0/
            - name: RECYCLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-stack
                  key: recyclarr_api_key
          ports:
            # Server API; nothing in the cluster calls it, so there is no Service.
            - name: http
              containerPort: 7982
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 150Mi
            limits:
              cpu: 500m
              memory: 750Mi
          volumeMounts:
            - name: recyclarr-pvc
              mountPath: /config
            # Mounted rather than copied in a postStart hook: v9 validates every config file when the
            # server starts, and a copy would race with that and could crash-loop it.
            - name: secrets
              mountPath: /config/secrets.yml
              subPath: secrets.yml
              readOnly: true
            - name: recyclarr-config
              mountPath: /config/recyclarr.yml
              subPath: recyclarr.yml
              readOnly: true
            - name: recyclarr-config
              mountPath: /config/settings.yml
              subPath: settings.yml
              readOnly: true
          # The image's own user is 1000:1000; 1501:1501 is the shared config-only id (docs/uids.md). It only writes /config (fsGroup below makes the
          # existing root-owned files writable) and reads secrets/config read-only.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1501
            runAsGroup: 1501
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: recyclarr-pvc
          persistentVolumeClaim:
            claimName: recyclarr-pvc
        - name: secrets
          secret:
            secretName: arr-stack
            items:
              - key: secrets.yml
                path: secrets.yml
        - name: recyclarr-config
          configMap:
            name: recyclarr-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recyclarr-pvc
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume-claim
    app.kubernetes.io/name: recyclarr-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: recyclarr-pv
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume
    app.kubernetes.io/name: recyclarr-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: recyclarr-pvc
    namespace: media
  local:
    path: /media/recyclarr
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - abaddon
