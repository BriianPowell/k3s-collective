apiVersion: apps/v1
kind: Deployment
metadata:
  name: recyclarr
  namespace: media
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: recyclarr
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: recyclarr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/name: recyclarr
      annotations:
        configmap.reloader.stakater.com/reload: recyclarr-config
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        # Makes the existing root-owned /config volume writable by gid 1501 (Seerr does the same).
        fsGroup: 1501
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: abaddon
      containers:
        - name: recyclarr
          image: ghcr.io/recyclarr/recyclarr:9.0.0 # {"$imagepolicy": "media:recyclarr"}
          imagePullPolicy: Always
          env:
            - name: TZ
              value: America/Los_Angeles
            # v9 runs a persistent server that refuses to start without a key of 32+ characters
            # (generate with `openssl rand -hex 32`; field `recyclarr_api_key` on the Arr Stack item).
            # https://recyclarr.dev/guide/upgrade-guide/v9.0/
            - name: RECYCLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-stack
                  key: recyclarr_api_key
            # Config, state and data are separate directories so /config can be read-only and only
            # /state needs the persistent volume (back it up: it records which Sonarr/Radarr
            # resources Recyclarr manages). /data holds regenerable downloads and logs.
            # https://recyclarr.dev/reference/env-vars/
            - name: RECYCLARR_CONFIG_DIR
              value: /config
            - name: RECYCLARR_STATE_DIR
              value: /state
            - name: RECYCLARR_DATA_DIR
              value: /data
          ports:
            # Server API; nothing in the cluster calls it, so the Service does not publish it.
            - name: http
              containerPort: 7982
              protocol: TCP
            # Health probes (/livez, /readyz) and Prometheus metrics (/metrics); no API key.
            # https://recyclarr.dev/reference/monitoring/
            - name: management
              containerPort: 7983
              protocol: TCP
          # The server opens no port until startup finishes, which includes the first download of
          # the TRaSH Guides, so allow a few minutes before liveness takes over.
          startupProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 150Mi
            limits:
              cpu: 500m
              memory: 750Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: recyclarr-pvc
              mountPath: /state
            - name: data
              mountPath: /data
          # The image's own user is 1000:1000; 1501:1501 is the shared config-only id (docs/uids.md). It only writes /state (fsGroup below makes the
          # existing root-owned files writable) and /data, and reads /config read-only.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1501
            runAsGroup: 1501
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: recyclarr-pvc
          persistentVolumeClaim:
            claimName: recyclarr-pvc
        # Everything the server reads, as one read-only directory. Projected rather than copied or
        # subPath-mounted: v9 validates every file when it starts, so they must all exist already.
        - name: config
          projected:
            sources:
              - configMap:
                  name: recyclarr-config
              - secret:
                  name: arr-stack
                  items:
                    - key: secrets.yml
                      path: secrets.yml
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recyclarr-pvc
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume-claim
    app.kubernetes.io/name: recyclarr-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: recyclarr-pv
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume
    app.kubernetes.io/name: recyclarr-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: recyclarr-pvc
    namespace: media
  local:
    path: /media/recyclarr
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - abaddon
