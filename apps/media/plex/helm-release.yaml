#
# References:
# https://github.com/munnerz/kube-plex - this didn't end working, lots of issues but a great idea
# https://github.com/plexinc/pms-docker/blob/master/charts/plex-media-server/README.md
#

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: plex
  namespace: media
  labels:
    app.kubernetes.io/component: helm-repository
    app.kubernetes.io/name: plex
spec:
  interval: 24h
  url: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex-media-server
  namespace: media
  labels:
    app.kubernetes.io/component: helm-release
    app.kubernetes.io/name: plex-server
spec:
  interval: 1h0m0s
  maxHistory: 3
  timeout: 10m0s
  chart:
    spec:
      chart: plex-media-server
      sourceRef:
        kind: HelmRepository
        name: plex
        namespace: media
      version: '>=1.9.0 <2.0.0'
  values:
    # The chart's default image (appVersion) lags behind Plex releases, so pin the image here.
    # 1.41.6.9685 was exploited on 2026-10-17. Bump this deliberately.
    image:
      tag: 1.43.4.10903-e5521bd8c
    ingress:
      enabled: false
    pms:
      # The container's s6 init still starts as root (it runs usermod/chown for PLEX_UID below),
      # but Plex itself runs as uid 1000, so only block privilege gain on top of that.
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      configStorage: 5Gi
      configExistingClaim: plex-pvc
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: '4'
          memory: 4Gi
          nvidia.com/gpu: 1
    runtimeClassName: nvidia
    # LAN :32400 via Traefik entryPoint plex (see ingress-tcp.yaml). In-cluster stays ClusterIP.
    service:
      type: ClusterIP
      port: 32400
    nodeSelector:
      kubernetes.io/hostname: sheol
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    extraEnv:
      HOSTNAME: PlexServer
      TZ: 'America/Los_Angeles'
      PLEX_UPDATE_CHANNEL: '5'
      # Non-root Plex. On the first start after this changed, the image's 40-plex-first-run
      # chowns /config (about 46k files) and /transcode to this uid/gid. To roll back, set
      # these to '0' and the same script chowns /config back to root.
      PLEX_UID: '1000'
      PLEX_GID: '1000'
      ALLOWED_NETWORKS: '10.0.0.0/16'
    extraVolumeMounts:
      # Plex only reads the library. Read-only means a compromised Plex cannot modify or
      # delete media (the miner ran as root with this mounted read-write).
      - name: data
        mountPath: /data
        readOnly: true
    extraVolumes:
      - name: data
        persistentVolumeClaim:
          claimName: media-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-pvc
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume-claim
    app.kubernetes.io/name: plex-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-pv
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume
    app.kubernetes.io/name: plex-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: plex-pvc
    namespace: media
  local:
    path: /mnt/moriyya/media/plex
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - sheol
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-pvc
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume-claim
    app.kubernetes.io/name: media-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data-pv
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume
    app.kubernetes.io/name: media-data-pv
spec:
  capacity:
    storage: 20Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: media-data-pvc
    namespace: media
  local:
    path: /mnt/moriyya/media/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - sheol
