# Plex LAN access: Traefik TCP :32400 → plex-media-server (ClusterIP). Do not forward on WAN.
# HTTPS UI remains IngressRoute plex.powell.place on websecure, behind Keycloak SSO (ingress.yaml).
# Note: Plex UDP discovery (GDM) is not proxied; clients can add http://10.0.2.10:32400 manually.
#
# References:
# https://doc.traefik.io/traefik/v3.1/middlewares/tcp/ipallowlist/
#
# Why the allowlist: this entrypoint was reachable from the internet through the router's
# :32400 forward. On 2026-10-17 13:10 PDT an attacker (45.194.92.222) sent unauthenticated,
# guest-level requests to Plex's companion-proxy endpoints (/player/proxy/poll,
# /player/timeline/subscribe). Those made Plex call itself on loopback, where requests are
# trusted, and fetch attacker-controlled content through the TheTVDB agent; a miner was
# running seconds later. Keep this entrypoint LAN-only. traefik has externalTrafficPolicy:
# Local, so the real client IP is preserved here and the allowlist is enforced.
apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: plex-lan-only
  namespace: media
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: plex-lan
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: plex-lan
  namespace: media
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: plex-lan
spec:
  entryPoints:
    - plex
  routes:
    - match: HostSNI(`*`)
      middlewares:
        - name: plex-lan-only
      services:
        - name: plex-media-server
          port: pms
