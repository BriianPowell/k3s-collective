apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr-dashboard-https
  namespace: media
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: prowlarr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`prowlarr.powell.place`)
      middlewares:
        # Keycloak SSO first; the app's own login stays on as a second layer.
        - name: traefik-forward-auth
          namespace: kube-system
        - name: security
          namespace: kube-system
      services:
        - name: prowlarr
          port: http
