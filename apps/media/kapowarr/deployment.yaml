#
# Reference:
# https://github.com/Casvt/Kapowarr
# https://casvt.github.io/Kapowarr/
#

apiVersion: v1
kind: Service
metadata:
  name: kapowarr
  namespace: media
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/name: kapowarr
spec:
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: kapowarr
  type: ClusterIP
  ports:
    - name: http
      port: 5656
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kapowarr
  namespace: media
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: kapowarr
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: kapowarr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/name: kapowarr
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: sheol
      # Kapowarr never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kapowarr
          # Was ":latest" with imagePullPolicy Always, so any restart pulled whatever was newest.
          # Now an explicit version, bumped by Flux image automation (image-automation.yaml, range
          # >=1.3.1 <2.0.0). v1.3.1 was the running version on 2026-10-17. Not pinned by digest
          # because the image-policy setter would drop it.
          image: docker.io/mrcas/kapowarr:v1.3.2 # {"$imagepolicy": "media:kapowarr"}
          imagePullPolicy: IfNotPresent
          # The image's entrypoint starts as root, chowns /app/db, /app/logs and
          # /app/temp_downloads, then drops to PUID:PGID with gosu. 1500:1500 is the shared
          # `media` owner of /data and of this app's config (see docs/uids.md).
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PUID
              value: '1500'
            - name: PGID
              value: '1500'
          ports:
            - name: http
              containerPort: 5656
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 150Mi
            limits:
              cpu: 500m
              memory: 750Mi
          volumeMounts:
            - name: kapowarr-pvc
              mountPath: /app/db
            - name: media-data-pvc
              mountPath: /data
      volumes:
        - name: kapowarr-pvc
          persistentVolumeClaim:
            claimName: kapowarr-pvc
        - name: media-data-pvc
          persistentVolumeClaim:
            claimName: media-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kapowarr-pvc
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume-claim
    app.kubernetes.io/name: kapowarr-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kapowarr-pv
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume
    app.kubernetes.io/name: kapowarr-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: kapowarr-pvc
    namespace: media
  local:
    path: /mnt/moriyya/media/kapowarr
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - sheol
