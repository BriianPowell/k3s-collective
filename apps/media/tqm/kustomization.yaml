apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
commonLabels:
  app.kubernetes.io/part-of: deluge

resources:
  - cronjob.yaml
  - onepassword-item.yaml

# Generated so a rule change gets a new ConfigMap name, which rolls into the CronJob.
configMapGenerator:
  - name: tqm-config
    files:
      - config.yaml
