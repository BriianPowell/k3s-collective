#
# Syncs 1Password item → Secret "tqm" in media namespace.
# Field labels must match secret keys exactly:
#   password — Deluge daemon login for the "tqm" user; written into Deluge's /config/auth by
#              the tqm-auth init container (apps/media/deluge). No ':' or spaces.
# https://developer.1password.com/docs/k8s/operator
#
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tqm
  namespace: media
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/name: tqm
spec:
  itemPath: vaults/Collective/items/tqm
