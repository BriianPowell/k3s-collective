#
# Reference:
# https://github.com/autobrr/tqm
#
# Two steps, in order:
#   clean:  removes Deluge torrents (and their data) that have met their tracker's seeding rules
#           (config.yaml). Talks to the Deluge daemon (deluge.media.svc:58846) as user "tqm";
#           Deluge itself deletes the files, so this container needs no access to /data.
#   orphan: deletes files under download_path that no Deluge torrent owns (e.g. torrents removed
#           without their data). Mounts /data and runs as the media owner (1500), who owns the
#           download folders.
#
# tqm publishes no container image, so an init container fetches the pinned release binary and
# checks it against the release's checksums file. To upgrade, bump TQM_VERSION and TQM_SHA256
# (linux_amd64 line of tqm_<version>_checksums.txt).
#
# To preview a rule change first, add --dry-run to the clean args / TQM_ORPHAN_ARGS and run:
#   kubectl -n media create job --from=cronjob/tqm tqm-manual
#   kubectl -n media logs job/tqm-manual -c clean
#   kubectl -n media logs job/tqm-manual -c orphan
#

apiVersion: batch/v1
kind: CronJob
metadata:
  name: tqm
  namespace: media
  labels:
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/name: tqm
spec:
  schedule: '15 */6 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cronjob
            app.kubernetes.io/name: tqm
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          # Deluge's VPN firewall only accepts the daemon port from LAN_NETWORK and sheol's own
          # pod subnet, so tqm must run next to it.
          nodeSelector:
            kubernetes.io/hostname: sheol
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fetch
              image: docker.io/library/alpine:3.22
              imagePullPolicy: IfNotPresent
              env:
                - name: TQM_VERSION
                  value: '1.20.0'
                - name: TQM_SHA256
                  value: a78573f4f123249e113f920892fd621dd890e86fdcb272f1daf887e25d5ec3ec
              command:
                - /bin/sh
                - -ec
                - |
                  cd /tmp
                  wget -q -O tqm.tar.gz "https://github.com/autobrr/tqm/releases/download/v${TQM_VERSION}/tqm_${TQM_VERSION}_linux_amd64.tar.gz"
                  echo "${TQM_SHA256}  tqm.tar.gz" | sha256sum -c -
                  tar -xzf tqm.tar.gz -C /opt/tqm tqm
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              volumeMounts:
                - name: bin
                  mountPath: /opt/tqm
                - name: tmp
                  mountPath: /tmp
            - name: clean
              image: docker.io/library/alpine:3.22
              imagePullPolicy: IfNotPresent
              command: ['/opt/tqm/tqm']
              args:
                - clean
                - deluge
                - --config=/config/config.yaml
                - --log=/tmp/tqm-clean.log
              env:
                - name: TZ
                  value: America/Los_Angeles
                # tqm creates a default config dir under here at startup, even with --config.
                - name: XDG_CONFIG_HOME
                  value: /tmp
                - name: TQM__CLIENTS_DELUGE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tqm
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: bin
                  mountPath: /opt/tqm
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: /config
                  readOnly: true
          containers:
            - name: orphan
              image: docker.io/library/alpine:3.22
              imagePullPolicy: IfNotPresent
              # tqm treats every file as an orphan if Deluge returns no torrents (e.g. the tqm
              # login lost its admin level), so a dry run goes first and the real run is skipped
              # when it sees no torrents or would delete more than half the files.
              command:
                - /bin/sh
                - -euc
                - |
                  tqm() { /opt/tqm/tqm orphan deluge --config=/config/config.yaml --log=/tmp/tqm-orphan.log "$@"; }
                  tqm --dry-run > /tmp/dry-run.out 2>&1 || { cat /tmp/dry-run.out; exit 1; }
                  torrents=$(sed -n 's/.*Retrieved \([0-9]*\) torrents.*/\1/p' /tmp/dry-run.out | head -n 1)
                  files=$(sed -n 's/.*: \([0-9]*\) files \/ [0-9]* folders.*/\1/p' /tmp/dry-run.out | head -n 1)
                  orphans=$(grep -c 'Removing orphan' /tmp/dry-run.out || true)
                  echo "dry run: ${torrents:-?} torrents, ${files:-?} files, ${orphans} orphans"
                  if [ "${torrents:-0}" -eq 0 ] || [ $((orphans * 2)) -gt "${files:-0}" ]; then
                    echo "refusing to delete orphans; dry-run output:" >&2
                    cat /tmp/dry-run.out >&2
                    exit 1
                  fi
                  [ "$orphans" -eq 0 ] || tqm ${TQM_ORPHAN_ARGS}
              env:
                - name: TQM_ORPHAN_ARGS
                  value: ''
                - name: TZ
                  value: America/Los_Angeles
                - name: XDG_CONFIG_HOME
                  value: /tmp
                - name: TQM__CLIENTS_DELUGE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tqm
                      key: password
              # Runs as the shared media owner (docs/uids.md), who owns /data and every download
              # Deluge writes, so it can delete orphans without root or any capability.
              securityContext:
                runAsNonRoot: true
                runAsUser: 1500
                runAsGroup: 1500
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: bin
                  mountPath: /opt/tqm
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: media-data
                  mountPath: /data
          volumes:
            - name: bin
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: config
              configMap:
                name: tqm-config
            - name: media-data
              persistentVolumeClaim:
                claimName: media-data-pvc
