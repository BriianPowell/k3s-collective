#
# Reference:
# https://docs.linuxserver.io/images/docker-sonarr/
#

apiVersion: v1
kind: Service
metadata:
  name: sonarr-anime
  namespace: media
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/name: sonarr-anime
spec:
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: sonarr-anime
  type: ClusterIP
  ports:
    - name: http
      port: 8989
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr-anime
  namespace: media
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: sonarr-anime
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: sonarr-anime
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/name: sonarr-anime
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: sheol
      containers:
        - name: sonarr-anime
          image: ghcr.io/linuxserver/sonarr:4.0.20 # {"$imagepolicy": "media:sonarr-anime"}
          imagePullPolicy: Always
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: PGID
              value: '0'
            - name: PUID
              value: '0'
            # The app's own login form is off: Keycloak SSO (oauth2-proxy-media, realm role
            # media-admin) is the only way in, and the ingress NetworkPolicy limits which pods can
            # reach this one. The API key is still required for API calls. Keep both of those in
            # place before turning this back to Forms.
            # https://wiki.servarr.com/sonarr/environment-variables
            - name: SONARR__AUTH__METHOD
              value: External
            - name: SONARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            # Reject requests whose Host header is not one of these (the public name, then the
            # in-cluster names Prowlarr, Seerr, Bazarr, Recyclarr and exportarr use). Update the
            # public name when hostnames are migrated. No health probes hit the pod IP.
            - name: SONARR__SERVER__ALLOWEDHOSTS
              value: sonarr-anime.powell.place,sonarr-anime.media.svc,sonarr-anime.media.svc.cluster.local,sonarr-anime
          ports:
            - name: http
              containerPort: 8989
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 150Mi
            limits:
              cpu: 500m
              memory: 750Mi
          volumeMounts:
            - name: sonarr-anime-pvc
              mountPath: /config
            - name: media-data-pvc
              mountPath: /data
      volumes:
        - name: sonarr-anime-pvc
          persistentVolumeClaim:
            claimName: sonarr-anime-pvc
        - name: media-data-pvc
          persistentVolumeClaim:
            claimName: media-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-anime-pvc
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume-claim
    app.kubernetes.io/name: sonarr-anime-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-anime-pv
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume
    app.kubernetes.io/name: sonarr-anime-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: sonarr-anime-pvc
    namespace: media
  local:
    path: /mnt/moriyya/media/sonarr-anime
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - sheol
