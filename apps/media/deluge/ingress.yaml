apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: deluge-dashboard-https
  namespace: media
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: deluge
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`deluge.powell.place`)
      middlewares:
        # Keycloak SSO (realm role media-admin) in front of the app's own login.
        - name: oauth2-proxy-media
          namespace: kube-system
        - name: security
          namespace: kube-system
      services:
        - name: deluge
          port: http
