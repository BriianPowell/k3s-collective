#
# Reference:
# https://github.com/binhex/arch-delugevpn
#

apiVersion: v1
kind: Service
metadata:
  name: deluge
  namespace: media
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/name: deluge
spec:
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: deluge
  type: ClusterIP
  ports:
    - name: http
      port: 8112
      protocol: TCP
      targetPort: http
    - name: privoxy
      port: 8118
      protocol: TCP
      targetPort: privoxy
    - name: microsocks
      port: 9118
      protocol: TCP
      targetPort: microsocks
    - name: thin
      port: 58846
      protocol: TCP
      targetPort: thin
    - name: vpn-tcp
      port: 58946
      protocol: TCP
      targetPort: vpn-tcp
    - name: vpn-udp
      port: 58946
      protocol: UDP
      targetPort: vpn-udp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge
  namespace: media
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: deluge
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: deluge
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/name: deluge
      annotations:
        secret.reloader.stakater.com/reload: tqm
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: sheol
      initContainers:
        # Upserts the daemon login tqm uses (apps/media/tqm) from 1Password. Only the "tqm:" line
        # is touched: localclient (used by the web UI) and other accounts stay Deluge-managed.
        # Exits 0 on problems so a missing secret never keeps Deluge down.
        - name: tqm-auth
          image: docker.io/library/alpine:3.22
          imagePullPolicy: IfNotPresent
          env:
            - name: TQM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tqm
                  key: password
                  optional: true
          command:
            - /bin/sh
            - -u
            - -c
            - |
              f=/config/auth
              if [ -z "${TQM_PASSWORD:-}" ]; then
                echo "tqm secret not synced yet, leaving $f alone"; exit 0
              fi
              case "$TQM_PASSWORD" in
                *:*|*' '*) echo "tqm password must not contain ':' or spaces, leaving $f alone" >&2; exit 0 ;;
              esac
              if [ ! -f "$f" ]; then
                echo "$f missing; Deluge creates it on first start, tqm is added on the next restart"; exit 0
              fi
              {
                grep -v '^tqm:' "$f" > "$f.tqm-tmp"
                printf 'tqm:%s:5\n' "$TQM_PASSWORD" >> "$f.tqm-tmp" &&
                  cat "$f.tqm-tmp" > "$f" &&
                  echo "tqm login written to $f"
              } || echo "failed to update $f, leaving it alone" >&2
              rm -f "$f.tqm-tmp"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: deluge-pvc
              mountPath: /config
              subPath: config
      containers:
        - name: arch-delugevpn
          image: ghcr.io/binhex/arch-delugevpn:2.2.0-7-09-libtorrentv1 # {"$imagepolicy": "media:deluge"}
          imagePullPolicy: Always
          env:
            - name: VPN_ENABLED
              value: 'yes'
            - name: VPN_USER
              valueFrom:
                secretKeyRef:
                  name: deluge
                  key: vpn_username
            - name: VPN_PASS
              valueFrom:
                secretKeyRef:
                  name: deluge
                  key: vpn_password
            - name: VPN_PROV
              value: pia
            - name: VPN_CLIENT
              value: wireguard
            - name: ENABLE_STARTUP_SCRIPTS
              value: 'no'
            - name: ENABLE_PRIVOXY
              value: 'no'
            - name: STRICT_PORT_FORWARD
              value: 'yes'
            - name: USERSPACE_WIREGUARD
              value: 'no'
            - name: ENABLE_SOCKS
              value: 'no'
            - name: SOCKS_USER
              value: admin
            - name: SOCKS_PASS
              value: socks
            - name: LAN_NETWORK
              value: '10.0.0.0/16'
            - name: NAME_SERVERS
              value: '84.200.69.80,37.235.1.174,1.1.1.1,37.235.1.177,84.200.70.40,1.0.0.1'
            - name: DELUGE_DAEMON_LOG_LEVEL
              value: debug
            - name: DELUGE_WEB_LOG_LEVEL
              value: debug
            - name: DELUGE_ENABLE_WEBUI_PASSWORD
              value: 'yes'
            # - name: VPN_INPUT_PORTS
            #   value: '1234'
            # - name: VPN_OUTPUT_PORTS
            #   value: '5678'
            - name: DEBUG
              value: 'false'
            # - name: UMASK
            #   value: '000'
            - name: PUID
              value: '0'
            - name: PGID
              value: '0'
          ports:
            - name: http
              containerPort: 8112
              protocol: TCP
            - name: privoxy
              containerPort: 8118
              protocol: TCP
            - name: microsocks
              containerPort: 9118
              protocol: TCP
            - name: thin
              containerPort: 58846
              protocol: TCP
            - name: vpn-tcp
              containerPort: 58946
              protocol: TCP
            - name: vpn-udp
              containerPort: 58946
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1500m
              # 1Gi was OOMKilled while loading/rechecking torrents after a long stop.
              memory: 2048Mi
          # livenessProbe:
          #   exec:
          #     command: ["/bin/bash", "-c", "curl -sL --fail http://localhost:8112 && curl -sL --fail https://google.com || exit 1"]
          #   initialDelaySeconds: 5
          #   periodSeconds: 5
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            # sysctls:
            #   - name: net.ipv4.conf.all.src_valid_mark
            #     value: "1"
            privileged: true
          volumeMounts:
            - name: tz
              mountPath: /etc/localtime
              readOnly: true
            - name: deluge-pvc
              mountPath: /config
              subPath: config
            - name: media-data-pvc
              mountPath: /data
      volumes:
        - name: tz
          hostPath:
            path: /etc/localtime
            type: File
        - name: deluge-pvc
          persistentVolumeClaim:
            claimName: deluge-pvc
        - name: media-data-pvc
          persistentVolumeClaim:
            claimName: media-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-pvc
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume-claim
    app.kubernetes.io/name: deluge-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: deluge-pv
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume
    app.kubernetes.io/name: deluge-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: deluge-pvc
    namespace: media
  local:
    path: /mnt/moriyya/media/deluge
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - sheol
