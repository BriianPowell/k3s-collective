#
# Reference:
# https://github.com/Lidarr/Lidarr
# https://docs.linuxserver.io/images/docker-lidarr/
#

apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: media
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/name: lidarr
spec:
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: lidarr
  type: ClusterIP
  ports:
    - name: http
      port: 8686
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: media
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: lidarr
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: lidarr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/name: lidarr
    spec:
      restartPolicy: Always
      # The app never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: sheol
      containers:
        - name: lidarr
          image: ghcr.io/linuxserver/lidarr:8.1.2135@sha256:8455e2c2f3a7e0fb56ab4de6be924d81aa441bfe9a740cf110d46b25a39b42ba
          imagePullPolicy: Always
          # 1500:1500 is the shared `media` owner of /data and of this app's config (see
          # docs/uids.md). The image fixes /config ownership itself on first start.
          # s6 starts as root, chowns /config and drops the app to PUID/PGID, so it keeps only the
          # capabilities that needs: CHOWN/DAC_OVERRIDE/FOWNER (ownership), SETUID/SETGID (the drop),
          # KILL (stopping the app). Same set as Radarr/Sonarr, where it was tested in a scratch pod.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - SETUID
                - SETGID
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: PGID
              value: '1500'
            - name: PUID
              value: '1500'
            # The app's own login form is off: Keycloak SSO (oauth2-proxy-media, realm role
            # media-admin) is the only way in, and the ingress NetworkPolicy limits which pods can
            # reach this one. The API key is still required for API calls. Keep both of those in
            # place before turning this back to Forms.
            # https://wiki.servarr.com/lidarr/environment-variables
            - name: LIDARR__AUTH__METHOD
              value: External
            - name: LIDARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            # The 0.8 line (tag 8.x) predates the Auth section and the External method: it reads
            # the flat config.xml keys and has only None, Basic and Forms. None matches External
            # here, since oauth2-proxy-media and the NetworkPolicy are the gate.
            - name: LIDARR__AUTHENTICATIONMETHOD
              value: None
            # Reject requests whose Host header is not one of these (the public name, then the
            # in-cluster names Prowlarr, Seerr, Bazarr, Recyclarr and exportarr use). Update the
            # public name when hostnames are migrated. No health probes hit the pod IP.
            - name: LIDARR__SERVER__ALLOWEDHOSTS
              value: lidarr.powell.place,lidarr.media.svc,lidarr.media.svc.cluster.local,lidarr
          ports:
            - name: http
              containerPort: 8686
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 150Mi
            limits:
              cpu: 500m
              memory: 750Mi
          volumeMounts:
            - name: lidarr-pvc
              mountPath: /config
            - name: media-data-pvc
              mountPath: /data
      volumes:
        - name: lidarr-pvc
          persistentVolumeClaim:
            claimName: lidarr-pvc
        - name: media-data-pvc
          persistentVolumeClaim:
            claimName: media-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-pvc
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume-claim
    app.kubernetes.io/name: lidarr-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: lidarr-pv
  namespace: media
  labels:
    type: local
    app.kubernetes.io/component: storage-volume
    app.kubernetes.io/name: lidarr-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: lidarr-pvc
    namespace: media
  local:
    path: /mnt/moriyya/media/lidarr
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - sheol
