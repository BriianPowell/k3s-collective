#
# Removes torrents from Deluge once they have met their per-tracker seeding rules.
# Rules: config.toml, logic: cleanup.py (both generated into ConfigMaps by kustomization.yaml).
# Deluge web API: https://deluge.readthedocs.io/en/latest/reference/webapi.html
# Password comes from the "deluge" secret (key "password"), the same one deluge-exporter uses.
#

apiVersion: batch/v1
kind: CronJob
metadata:
  name: deluge-cleanup
  namespace: media
  labels:
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/name: deluge-cleanup
spec:
  schedule: '15 */6 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cronjob
            app.kubernetes.io/name: deluge-cleanup
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: abaddon
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              # Script is stdlib-only (tomllib needs >= 3.11); minor tag floats, so no image automation.
              image: docker.io/library/python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: ['python', '/app/cleanup.py']
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: '1'
                - name: PYTHONUNBUFFERED
                  value: '1'
                - name: DELUGE_URL
                  value: http://deluge.media.svc:8112
                - name: DELUGE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: deluge
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: app
                  mountPath: /app
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: app
              configMap:
                name: deluge-cleanup-script
            - name: config
              configMap:
                name: deluge-cleanup-config
