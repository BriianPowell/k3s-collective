# Rules for deluge-cleanup. See cleanup.py for how they are evaluated.
#
# Start with dry_run = true and read the logs of a manual run; flip it to false
# once the "would remove" lines look right:
#   kubectl -n media create job --from=cronjob/deluge-cleanup manual-1
#   kubectl -n media logs job/manual-1
dry_run = true

# Delete downloaded files along with the torrent. Safe when Sonarr/Radarr/Lidarr
# import by hardlink or copy; set false to only drop the torrent from Deluge.
remove_data = true

# Safety valve in case a bad rule matches everything.
max_removals_per_run = 10

# Torrents with these Deluge labels are never removed.
protected_labels = ["keep"]

# Public torrents (no private flag, no matching tracker rule).
[public]
min_ratio = 1.0
max_seed_hours = 72

# One table per private tracker. Everything below is unconfigured, so private
# torrents are all kept for now: fill in each tracker's own hit-and-run rules.
#
#   hosts           tracker hostnames; subdomains match too (tracker.x.org matches x.org)
#   min_seed_hours  hard floor, never removed before this much seeding time
#   min_ratio       remove once ratio reaches this
#   max_seed_hours  remove after this much seeding time regardless of ratio
#
# [tracker.example]
# hosts = ["example.org"]
# min_seed_hours = 120   # 5 days
# min_ratio = 2.0
# max_seed_hours = 336   # 14 days
