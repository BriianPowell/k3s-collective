apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
commonLabels:
  app.kubernetes.io/part-of: deluge

resources:
  - cronjob.yaml

# Generated so a script or rule change gets a new ConfigMap name, which rolls into the CronJob.
configMapGenerator:
  - name: deluge-cleanup-script
    files:
      - cleanup.py
  - name: deluge-cleanup-config
    files:
      - config.toml
