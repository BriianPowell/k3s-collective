apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: monitoring
  labels:
    app.kubernetes.io/component: service-monitor
    app.kubernetes.io/name: traefik
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: service
      app.kubernetes.io/name: traefik
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    # In-process counters are cheap to scrape; the request-rate panels need more than the 4m used
    # for exporters that poll an app API on every scrape.
    - interval: 60s
      targetPort: 9100
      scrapeTimeout: 30s
      path: /metrics
