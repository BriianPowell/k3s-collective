apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: adguard
  namespace: monitoring
  labels:
    app.kubernetes.io/component: service-monitor
    app.kubernetes.io/name: adguard
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: service
      app.kubernetes.io/name: adguard-exporter
  namespaceSelector:
    matchNames:
      - adguard
  endpoints:
    # 60s rather than the 4m used for other API-polling exporters: one AdGuard API call a minute
    # is cheap, and the query and latency rate panels are empty at 4m.
    - interval: 60s
      port: metrics
      scrapeTimeout: 30s
