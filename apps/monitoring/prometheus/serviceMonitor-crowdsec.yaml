apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crowdsec-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/component: service-monitor
    app.kubernetes.io/name: crowdsec-agent-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: service
      app.kubernetes.io/name: crowdsec-agent
  namespaceSelector:
    matchNames:
      - crowdsec
  attachMetadata:
    node: true
  endpoints:
    # In-process counters are cheap to scrape; the rate panels need more than the 4m used for
    # exporters that poll an app API on every scrape.
    - interval: 60s
      port: metrics
      scrapeTimeout: 30s
      path: /metrics
      metricRelabelings:
        - sourceLabels: [ __meta_kubernetes_pod_node_name ]
          targetLabel: machine
