#
# Syncs 1Password item → Secret "oauth2-proxy" in kube-system.
# Field labels in 1Password must be exactly:
#   client_id, client_secret, cookie_secret, cluster_cookie_secret
#   client_id / client_secret: the Keycloak client `oauth2-proxy` (realm inferno), shared by both
#     instances (media and cluster); the client lists both callback URLs as redirect URIs
#   cookie_secret (media instance) and cluster_cookie_secret (cluster instance) MUST differ.
#   Each: 32 random bytes, e.g. `openssl rand -base64 32 | tr -- '+/' '-_'`
# https://developer.1password.com/docs/k8s/operator
#
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: oauth2-proxy
  namespace: kube-system
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: oauth2-proxy
spec:
  itemPath: vaults/Collective/items/Oauth2 Proxy
