apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: wiki-js
  namespace: wiki
  labels:
    app.kubernetes.io/component: image-repository
    app.kubernetes.io/name: wiki-js
spec:
  image: docker.io/requarks/wiki
  interval: 24h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: wiki-js
  namespace: wiki
  labels:
    app.kubernetes.io/component: image-policy
    app.kubernetes.io/name: wiki-js
spec:
  imageRepositoryRef:
    name: wiki-js
    namespace: wiki
  policy:
    semver:
      # Stay on 2.x: Wiki.js 3.x needs PostgreSQL >= 17 (the cluster is on 16) and is a different major
      # release. Raise this only after the database is upgraded and a migration is planned.
      range: '>=2.5.303 <3.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: wiki-js
  namespace: wiki
  labels:
    app.kubernetes.io/component: image-update-automation
    app.kubernetes.io/name: wiki-js
spec:
  interval: 24h0m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: FluxCDBot
      messageTemplate: |
        🚨 Image Automation Update 🚨
        {{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}
    push:
      branch: main
  update:
    path: ./apps/base/wiki-js
    strategy: Setters
