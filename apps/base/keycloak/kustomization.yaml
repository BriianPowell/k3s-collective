apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
labels:
  - pairs:
      app.kubernetes.io/part-of: keycloak
    includeSelectors: true
    includeTemplates: true

resources:
  - deployment.yaml
  - onepassword-item.yaml
  # - image-automation.yaml # version 26 of keycloak is busted
  - ingress.yaml
  - pgcluster.yaml
