apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeassistant
labels:
  - pairs:
      app.kubernetes.io/part-of: homeassistant
    includeSelectors: true
    includeTemplates: true

resources:
  - deployment.yaml
  - ingress.yaml
  - ingress-tcp.yaml
  - mosquitto.yaml
  - onepassword-item.yaml
  - pgcluster.yaml
