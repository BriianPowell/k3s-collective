# MQTT via Traefik TCP (node :1883 / :8883 / :443 → Mosquitto ClusterIP :1883). Mosquitto has no hostNetwork.
#
# Deliberate exception: MQTT is intended to be reachable from both the LAN and the internet
# (a remote client connects on :8883). It cannot sit behind SSO (non-browser clients), so its
# protection is TLS plus Mosquitto's password file (allow_anonymous false).
#
# - :1883 (mqtt): plain MQTT, LAN only (enforced by the mosquitto-lan-only middleware below).
# - :8883 (mqtts): TLS; LAN and internet (some networks block non-443 outbound).
# - :443 (websecure): TLS + SNI mqtt.powell.place (VPN / restrictive egress).
# References:
# https://doc.traefik.io/traefik/v3.1/middlewares/tcp/ipallowlist/
#
# Why the allowlist: :1883 is plaintext (credentials and payloads unencrypted), and "do not
# forward on WAN" was only a comment, not enforced. Remote clients must use the TLS routes
# below. traefik has externalTrafficPolicy: Local, so the real client IP is preserved and
# the allowlist is enforced (same approach as plex-lan-only in apps/media/plex).
apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: mosquitto-lan-only
  namespace: homeassistant
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: mosquitto-lan-only
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/16
---
# Mosquitto has no login throttling or lockout, and CrowdSec only watches HTTP access logs, so cap
# simultaneous connections per source IP on the internet-facing TLS routes. This slows password
# guessing from one address (it does not stop a distributed attempt; the password strength does).
# The real client IP is preserved (externalTrafficPolicy: Local), so the cap is per client.
# References: https://doc.traefik.io/traefik/middlewares/tcp/inflightconn/
apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: mosquitto-conn-limit
  namespace: homeassistant
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: mosquitto-conn-limit
spec:
  inFlightConn:
    amount: 10
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mosquitto-mqtt-lan
  namespace: homeassistant
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: mosquitto-mqtt-lan
spec:
  entryPoints:
    - mqtt
  routes:
    - match: HostSNI(`*`)
      middlewares:
        - name: mosquitto-lan-only
      services:
        - name: mosquitto
          port: 1883
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mosquitto-mqtts
  namespace: homeassistant
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: mosquitto-mqtts
spec:
  entryPoints:
    - mqtts
  routes:
    - match: HostSNI(`mqtt.powell.place`)
      middlewares:
        - name: mosquitto-conn-limit
      services:
        - name: mosquitto
          port: 1883
  tls:
    secretName: wildcard-powell-place
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mosquitto-mqtts-443
  namespace: homeassistant
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: mosquitto-mqtts-443
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`mqtt.powell.place`)
      middlewares:
        - name: mosquitto-conn-limit
      services:
        - name: mosquitto
          port: 1883
  tls:
    secretName: wildcard-powell-place
