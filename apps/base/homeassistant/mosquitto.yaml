apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto
  namespace: homeassistant
  labels:
    app.kubernetes.io/component: config
    app.kubernetes.io/name: mosquitto
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous false
    password_file /mosquitto/config/passwd
    # Per-user topic permissions; a user or topic not listed in acl.conf is denied.
    acl_file /mosquitto/config/acl
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
  # Topic layout: on-air/{device} is the retained state each agent publishes and the sign and
  # Home Assistant read (on-air protocol README); homeassistant/# is HA's own discovery/status.
  # Logins: `homeassistant` (HA, mqtt-username/-password), `on-air-agent` (publishes) and
  # `on-air-sign` (subscribes), the last two from the optional secret keys below.
  acl.conf: |
    # STAGE 1: the shared `homeassistant` login is still used by the on-air agent and sign, so it
    # stays unrestricted. Once both use their own logins, replace this block with:
    #   user homeassistant
    #   topic read on-air/#
    #   topic readwrite homeassistant/#
    user homeassistant
    topic readwrite #

    user on-air-agent
    topic write on-air/+

    user on-air-sign
    topic read on-air/+
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: homeassistant
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/name: mosquitto
spec:
  selector:
    app.kubernetes.io/component: broker
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: homeassistant
  labels:
    app.kubernetes.io/component: broker
    app.kubernetes.io/name: mosquitto
  annotations:
    # The config is copied by the init container, so a changed ConfigMap needs a restart.
    configmap.reloader.stakater.com/reload: mosquitto
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: broker
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/component: broker
        app.kubernetes.io/name: mosquitto
    spec:
      automountServiceAccountToken: false
      # The image's mosquitto user is 1883. The entrypoint would start as root and chown then drop
      # privileges; running as 1883 from the start needs no root (data is already owned by 1883).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: abaddon
      initContainers:
        - name: init-config
          image: docker.io/library/eclipse-mosquitto:2.0.22 # {"$imagepolicy": "homeassistant:mosquitto"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          command:
            - /bin/sh
            - -c
            - |
              cp /config-template/mosquitto.conf /mosquitto/config/mosquitto.conf
              cp /config-template/acl.conf /mosquitto/config/acl
              mosquitto_passwd -b -c /mosquitto/config/passwd "$MQTT_USERNAME" "$MQTT_PASSWORD"
              # Optional per-client logins; skipped until the 1Password fields exist.
              if [ -n "$MQTT_AGENT_PASSWORD" ]; then
                mosquitto_passwd -b /mosquitto/config/passwd on-air-agent "$MQTT_AGENT_PASSWORD"
              fi
              if [ -n "$MQTT_SIGN_PASSWORD" ]; then
                mosquitto_passwd -b /mosquitto/config/passwd on-air-sign "$MQTT_SIGN_PASSWORD"
              fi
          env:
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homeassistant
                  key: mqtt-username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homeassistant
                  key: mqtt-password
            - name: MQTT_AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homeassistant
                  key: mqtt-agent-password
                  optional: true
            - name: MQTT_SIGN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homeassistant
                  key: mqtt-sign-password
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /mosquitto/config
      containers:
        - name: mosquitto
          image: docker.io/library/eclipse-mosquitto:2.0.22 # {"$imagepolicy": "homeassistant:mosquitto"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
            - name: mosquitto-data
              mountPath: /mosquitto/data
      volumes:
        - name: config-template
          configMap:
            name: mosquitto
        - name: config
          emptyDir: {}
        - name: mosquitto-data
          persistentVolumeClaim:
            claimName: mosquitto-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-pvc
  namespace: homeassistant
  labels:
    type: local
    app.kubernetes.io/component: storage-volume-claim
    app.kubernetes.io/name: mosquitto-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mosquitto-pv
  namespace: homeassistant
  labels:
    type: local
    app.kubernetes.io/component: storage-volume
    app.kubernetes.io/name: mosquitto-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: mosquitto-pvc
    namespace: homeassistant
  local:
    path: /data/homeassistant/mosquitto
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - abaddon
