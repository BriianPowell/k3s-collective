#
# Reference:
# https://github.com/xperimental/nextcloud-exporter
#

apiVersion: v1
kind: Service
metadata:
  name: nextcloud-exporter
  namespace: nextcloud
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/name: nextcloud-exporter
spec:
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: nextcloud-exporter
  ports:
    - name: metrics
      port: 9205
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-exporter
  namespace: nextcloud
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: nextcloud-exporter
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: nextcloud-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/name: nextcloud-exporter
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      containers:
        - name: nextcloud-exporter
          image: ghcr.io/xperimental/nextcloud-exporter:0.7.0@sha256:85d412884b6cc14c0cfc03d68bc1d15a6f5a2144a4152ba333ce902ade681c8b
          imagePullPolicy: IfNotPresent
          # A static Go binary; the image's user is already nobody (65534).
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ['ALL']
          env:
            - name: NEXTCLOUD_SERVER
              value: http://nextcloud.nextcloud.svc
            - name: NEXTCLOUD_LISTEN_ADDRESS
              value: :9205
            - name: NEXTCLOUD_TIMEOUT
              value: 15s
            - name: NEXTCLOUD_TLS_SKIP_VERIFY
              value: 'false'
            - name: NEXTCLOUD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: token
          ports:
            - name: metrics
              containerPort: 9205
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 150Mi
            limits:
              cpu: 150m
              memory: 250Mi
