apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  namespace: nextcloud
  labels:
    app.kubernetes.io/component: service
    app.kubernetnes.io/name: nextcloud-redis
spec:
  selector:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: nextcloud-redis
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  namespace: nextcloud
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: nextcloud-redis
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
      app.kubernetes.io/name: nextcloud-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        app.kubernetes.io/name: nextcloud-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nextcloud-redis
          image: redis:alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
          imagePullPolicy: Always
          # The image's own redis user is 999 (it drops to it from root on start). Run as it
          # directly; the image's /data is owned by it and nothing else is written.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ['ALL']
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              cpu: 300m
              memory: 500Mi
      restartPolicy: Always
