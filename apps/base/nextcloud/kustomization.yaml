apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextcloud
labels:
  - pairs:
      app.kubernetes.io/part-of: nextcloud
    includeSelectors: true
    includeTemplates: true

resources:
  - cron.yaml
  - deployment.yaml
  - onepassword-item.yaml
  - exporter.yaml
  - ingress.yaml
  - middleware.yaml
  - pgcluster.yaml
  - redis.yaml
