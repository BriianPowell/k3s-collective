apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-cron
  namespace: nextcloud
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/name: nextcloud-cron
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: cron
      app.kubernetes.io/name: nextcloud-cron
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cron
        app.kubernetes.io/name: nextcloud-cron
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cron
          # Same tag as the web deployment so cron never runs a different major version than the app.
          image: nextcloud:production-apache@sha256:515c072ea1cf82ece3503f301fdf75dd5a7148abcc8fa10aaefd5ec56643b703
          imagePullPolicy: Always
          # busybox crond runs as root and starts each job as www-data, so root and the usual
          # capabilities stay. Block privilege gain and use the runtime's default seccomp filter.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          command:
            - /cron.sh
          resources:
            requests:
              cpu: 10m
              memory: 15Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: nextcloud-storage
              mountPath: /var/www/html
      restartPolicy: Always
      volumes:
        - name: nextcloud-storage
          persistentVolumeClaim:
            claimName: nextcloud-pvc
