apiVersion: v1
kind: Service
metadata:
  name: atuin
  namespace: atuin
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/name: atuin
spec:
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: atuin
  ports:
    - name: http
      port: 8888
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9001
      protocol: TCP
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin
  namespace: atuin
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: atuin
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: atuin
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/name: atuin
    spec:
      # The server only talks to Postgres; it never calls the Kubernetes API.
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: abaddon
      containers:
        - name: atuin
          image: ghcr.io/atuinsh/atuin:18.24.3 # {"$imagepolicy": "atuin:atuin"}
          imagePullPolicy: Always
          # The image's own user is 1000, which is the nodes' admin login, so run as the utilities id
          # instead (see docs/uids.md). /config is only the server's config directory: the old
          # volume held a server.toml that was the stock template with every line commented out
          # (all settings come from the environment below), so an emptyDir is equivalent. The
          # server writes a fresh default file there on start.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1511
            runAsGroup: 1511
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ['ALL']
          args:
            - start
          env:
            - name: ATUIN_DB_URI
              valueFrom:
                secretKeyRef:
                  name: atuin-pgcluster-app
                  key: uri
                  optional: false
            - name: ATUIN_HOST
              value: 0.0.0.0
            - name: ATUIN_PORT
              value: '8888'
            # Closed: this host is public. To add an account, flip this to 'true', register, flip it back.
            # Existing users keep syncing either way.
            - name: ATUIN_OPEN_REGISTRATION
              value: 'false'
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
            - name: metrics
              containerPort: 9001
              protocol: TCP
          # Measured 2026-10-26: about 6 MiB of memory (peak 6.4 MiB over 6 hours) and 0.0003 cores.
          # The limit leaves headroom for a large first sync from a new machine.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          emptyDir:
            sizeLimit: 10Mi
