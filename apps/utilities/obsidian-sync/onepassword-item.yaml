#
# Syncs 1Password item -> Secret "obsidian-sync" in the obsidian-sync namespace.
# Field labels must match the secret keys exactly:
#   username      - CouchDB admin user (also what the Obsidian LiveSync plugin logs in with)
#   password      - CouchDB admin password (long and random; this is the only login in front of the notes)
#   cookie_secret - random string that keeps CouchDB session cookies valid across restarts
# https://developer.1password.com/docs/k8s/operator
#
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: obsidian-sync
  namespace: obsidian-sync
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/name: obsidian-sync
spec:
  itemPath: vaults/Collective/items/obsidian-sync
