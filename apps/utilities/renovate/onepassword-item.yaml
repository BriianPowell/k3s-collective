#
# Syncs 1Password item -> Secret "renovate" in this namespace.
# Field labels in 1Password must be exactly:
#   app_id           GitHub App ID (number)
#   installation_id  Installation ID of the App on BriianPowell/k3s-collective
#   private_key      The App's private key, the whole PEM (BEGIN/END lines included)
#   git_author       Commit author, e.g. "renovate-k3s[bot] <ID+renovate-k3s[bot]@users.noreply.github.com>"
# The App needs only this repository, with: Contents, Pull requests, Issues, Workflows (read and
# write), Commit statuses (read and write), Checks (read and write), Metadata (read).
# https://developer.1password.com/docs/k8s/operator
# https://docs.renovatebot.com/modules/platform/github/#running-as-a-github-app
#
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: renovate
  namespace: renovate
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/name: renovate
    app.kubernetes.io/part-of: renovate
spec:
  itemPath: vaults/Collective/items/Renovate
